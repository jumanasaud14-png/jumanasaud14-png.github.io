$('undo').onclick=()=>{const last=undo.pop();if(last){pc.putImageData(last,0,0);compose();}$('undo').disabled=!undo.length;};$('clear').onclick=()=>{remember();pc.clearRect(0,0,paint.width,paint.height);compose();};$('previous').onclick=()=>{stash();page--;load();};$('next').onclick=()=>{stash();page++;load();};$('pages').onchange=e=>{stash();page=+e.target.value;load();};$('language').onclick=()=>setLanguage(lang==='ar'?'en':'ar');window.addEventListener('languagechange',()=>{lang=siteLang();state();});$('print').onclick=()=>window.print();$('save').onclick=()=>{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=current().id+'-'+page+'.png';a.click();$('status').textContent=t('تم تجهيز رسمتك للتحميل.','Your artwork is ready to download.');};load();
</script></body></html>
